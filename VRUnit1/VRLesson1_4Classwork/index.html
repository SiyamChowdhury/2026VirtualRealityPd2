<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>

      <!-- Task 1: Wrap the components below into an entity. "Label" it snowman -->
      <!-- Task 2: Duplicate the snowman to different locations and rotation -->
        <!-- Body -->
        <a-box class = "Snowman" wireframe = "true" width = "12" height = "12" depth = "12">
            <a-sphere position="1 0.5 -0.5" radius="1.25" color="white"></a-sphere>
            <a-sphere position="1 2.25 -0.5" radius="1.05" color="white"></a-sphere>
            <a-sphere position="1 3.5 -0.5" radius=".85" color="white"></a-sphere>
            <!-- Eyes -->
            <a-sphere position=".75 4.5 0.25" radius=".15" color="black"></a-sphere>
            <a-sphere position="1.25 4.5 0.25" radius=".15" color="black"></a-sphere>
            <!-- Nose and Arms -->
            <a-cone position="1 3.25 0.5"  rotation="90 0 0" color="tomato" height="0.5" radius-bottom=".1" radius-top="0.01"></a-cone>
            <a-cylinder position="-0.25 2.75 -0.25" color="#A52A2A" rotation="0 0 60" height="2" radius="0.15"></a-cylinder>
            <a-cylinder position="2.25 2.75 -0.25" color="#A52A2A" rotation="0 0 -60" height="2" radius="0.15"></a-cylinder>
            <a-sphere position="1 1 -0.5" radius="3" color="white"></a-sphere>
            <a-sphere position="1 2.5 -0.5" radius="2" color="white"></a-sphere>
            <a-sphere position="1 4 -0.5" radius="1" color="white"></a-sphere>
            <!-- Eyes -->
            <a-sphere position=".75 3.5 0.25" radius=".15" color="black"></a-sphere>
            <a-sphere position="1.25 3.5 0.25" radius=".15" color="black"></a-sphere>
            <!-- Nose and Arms -->
            <a-cone position="1 3.25 0.5"  rotation="90 0 0" color="tomato" height="0.5" radius-bottom=".1" radius-top="0.01"></a-cone>
            <a-cylinder position=".75 2.75 -0.25" color="#A52A2A" rotation="0 0 60" height="2" radius="0.15"></a-cylinder>
            <a-cylinder position="2.25 2.75 -0.25" color="#A52A2A" rotation="0 0 -60" height="2" radius="0.15"></a-cylinder>
        </a-box>

      <!-- Task 3: Wrap the components below into an entity. "Label" it tree -->
      <!-- Task 4: Duplicate the tree to different locations and rotation -->
      <a-box class = "tree" wireframe = "true" width = "30" height = "30" depth = "30">
        <!-- Trunk -->
        <a-cylinder position="0 0 0" height="3" radius=".75" color="brown"></a-cylinder>
        <!-- Pines -->
        <a-cone position="0 1.5 0" height="1.5" radius-bottom="2" radius-top="0.1" color="green"></a-cone>
        <a-cone position="0 2.5 0" height="1.5" radius-bottom="1.7" radius-top="0.1" color="green"></a-cone>
        <a-cone position="0 3.5 0" height="1.5" radius-bottom="1.4" radius-top="0.1" color="green"></a-cone>
        <a-cone position="0 4.5 0" height="1.5" radius-bottom="1.1" radius-top="0.1" color="green"></a-cone>
        <a-cone position="0 5.5 0" height="1.5" radius-bottom="0.9" radius-top="0.1" color="green"></a-cone>
        <a-cone position="0 6.5 0" height="1.5" radius-bottom="0.7" radius-top="0.1" color="green"></a-cone>
        <!-- Trunk -->
        <a-cylinder position="10 0 0" height="3" radius=".75" color="brown"></a-cylinder>
        <!-- Pines -->
        <a-cone position="10 1.5 0" height="1.5" radius-bottom="2" radius-top="0.1" color="green"></a-cone>
        <a-cone position="10 2.5 0" height="1.5" radius-bottom="1.7" radius-top="0.1" color="green"></a-cone>
        <a-cone position="10 3.5 0" height="1.5" radius-bottom="1.4" radius-top="0.1" color="green"></a-cone>
        <a-cone position="10 4.5 0" height="1.5" radius-bottom="1.1" radius-top="0.1" color="green"></a-cone>
        <a-cone position="10 5.5 0" height="1.5" radius-bottom="0.9" radius-top="0.1" color="green"></a-cone>
        <a-cone position="10 6.5 0" height="1.5" radius-bottom="0.7" radius-top="0.1" color="green"></a-cone>
      </a-box>
      
      <a-plane position="0 0 -1" rotation="-90 0 0" width="50" height="50" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
      <!-- Camera is added so that you do not "spawn" at the origin -->
      <a-camera position="0 1.3 4"></a-camera>
    </a-scene>
  </body>
</html>
