<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-box position="-1 1 -2.5" rotation="0 90 0" width = "5" depth = "3" height = ".5" color="black"></a-box>
      <a-box position="-1 1.5 -5.5" rotation="0 90 0" width = "2" depth = "4" color="purple"></a-box>
      <a-box position="-1 2 -2.5" rotation="0 90 0" width = "4" depth = "4" height = "2" color="purple"></a-box>
      <a-box position="-1 1.5 .5" rotation="0 90 0" width = "2" depth = "4" color="purple"></a-box>
      <a-box position="-2.55 1.75 1.25" height=".5"></a-box>
      <a-box position=".55 1.75 1.25" height=".5" ></a-box>
      <a-box position="-2.55 1.75 -6.25" height=".5" color="red"></a-box>
      <a-box position=".55 1.75 -6.25" height=".5" color="red"></a-box>
      <a-box position="-3 1.75 1.25" height=".51" width=".2" depth="1.1" color="yellow"></a-box>
      <a-box position="1 1.75 1.25" height=".51" width=".2" depth="1.1" color="yellow"></a-box>
      <a-box position="-3 1.75 -6.25" height=".51" width=".2" depth="1.1" color="yellow"></a-box>
      <a-box position="1 1.75 -6.25" height=".51" width=".2" depth="1.1" color="yellow"></a-box>

      <a-cylinder position=".5 .75 -4" rotation = "90 90 0" radius="0.5" height="1.5" color="#C0C0C0"></a-cylinder>
      <a-cylinder position="-2.5 .75 -4" rotation = "90 90 0" radius="0.5" height="1.5" color="#C0C0C0"></a-cylinder>
      <a-cylinder position=".5 .75 -1" rotation = "90 90 0" radius="0.5" height="1.5" color="#C0C0C0"></a-cylinder>
      <a-cylinder position="-2.5 .75 -1" rotation = "90 90 0" radius="0.5" height="1.5" color="#C0C0C0"></a-cylinder>
      <a-torus position = "1.25 .75 -1" src = "tire.jpg" repeat = "3 2" rotation = "0 90 0" radius = ".5" radius-tubular = "0.1"></a-torus>
      <a-torus position = "-3.25 .75 -1" src = "tire.jpg" repeat = "3 2" rotation = "0 90 0" radius = ".5" radius-tubular = "0.1"></a-torus>
      <a-torus position = "-3.25 .75 -4" src = "tire.jpg" repeat = "3 2" rotation = "0 90 0" radius = ".5" radius-tubular = "0.1"></a-torus>
      <a-torus position = "1.25 .75 -4" src = "tire.jpg" repeat = "3 2" rotation = "0 90 0" radius = ".5" radius-tubular = "0.1"></a-torus>
      <a-circle position = "1.3 .75 -1" src = "OIP.webp" rotation = "0 90 0" radius = ".5"></a-circle>
      <a-circle position = "1.3 .75 -4" src = "OIP.webp" rotation = "0 90 0" radius = ".5"></a-circle>
      <a-circle position = "-3.3 .75 -1" src = "OIP.webp" rotation = "0 275 0" radius = ".5"></a-circle>
      <a-circle position = "-3.3 .75 -4" src = "OIP.webp" rotation = "0 275 0" radius = ".5"></a-circle>

      <a-plane src = "road.jpg" position="0 0 -4" rotation="-90 0 0" width="20" height="50" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
      <a-camera position="0 1.4 5"></a-camera>
    </a-scene>
  </body>
</html>
